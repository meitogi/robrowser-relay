<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="ui.css">
<style>
	body { width: 300px; padding: 12px; }
	body > * + * { margin-top: 10px; }
	.checks { margin: 0; padding: 0; list-style: none; }
	.checks li { display: flex; gap: 6px; }
	.checks li + li { margin-top: 4px; }
	.checks .mark { width: 1em; flex: none; text-align: center; font-weight: 600; }
	.checks [data-level='pass'] .mark { color: var(--ready); }
	.checks [data-level='warn'] .mark, .checks [data-level='fail'] .mark { color: var(--nogrf); }
	.checks [data-level='wait'] .mark { color: var(--muted); }
</style>
</head>
<body>
<div class="brand">
	<img src="icons/icon-48.png" alt="">
	<div><strong>roBrowser relay</strong><small id="version"></small></div>
</div>
<div class="status" id="status">
	<span class="mark" aria-hidden="true"></span>
	<div><strong></strong><span class="detail">…</span></div>
</div>
<ul class="checks" id="checks" hidden></ul>
<label class="switch">Relay on <input type="checkbox" role="switch" id="enabled"></label>
<button class="btn primary" id="grant" hidden>Allow access to the game pages and cyro.live</button>
<button class="btn" id="store">Choose the client folder…</button>
<a class="btn" id="patch" href="https://raw.githubusercontent.com/meitogi/robrowser-relay/main/cyro-live-patch/robrowser-relay-cyro.user.js" target="_blank" hidden>Install the cyro.live patch</a>
<script src="browser.js"></script>
<script src="db.js"></script>
<script src="state.js"></script>
<script src="ui.js"></script>
<script src="popup.js"></script>
</body>
</html>
